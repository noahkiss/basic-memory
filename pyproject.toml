[project]
name = "basic-memory"
dynamic = ["version"]
description = "Local-first knowledge management combining Zettelkasten with knowledge graphs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Noah Kiss", email = "noahkiss@users.noreply.github.com" }
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "pydantic[email,timezone]>=2.12.0",
    "mcp>=1.23.1",
    "pydantic-settings>=2.6.1",
    "loguru>=0.7.3",
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.1.0",
    "rich>=13.9.4",
    "unidecode>=1.3.8",
    "dateparser>=1.2.0",
    "watchfiles>=1.0.4",
    "fastapi[standard]>=0.136.1",
    "alembic>=1.14.1",
    "pillow>=11.1.0",
    "pybars3>=0.9.7",
    "fastmcp>=3.3.1,<4",
    "aiofiles>=24.1.0",
    # alembic/env.py applies it (on Python < 3.14) so migrations can run from
    # inside an already-running event loop. Not backend-specific.
    "nest-asyncio>=1.6.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.7",
    "mdformat-frontmatter>=2.0.8",
    "anyio>=4.10.0",
    "httpx>=0.28.0",
    "fastembed>=0.7.4",
    "sqlite-vec>=0.1.6",
    # Also serves every OpenAI-compatible embedding server (Ollama, LM Studio,
    # vLLM, OpenRouter) through semantic_embedding_api_base -> AsyncOpenAI base_url.
    "openai>=1.100.2",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/noahkiss/basic-memory"
Repository = "https://github.com/noahkiss/basic-memory"
Documentation = "https://github.com/noahkiss/basic-memory#readme"

[project.scripts]
basic-memory = "basic_memory.cli.main:app"
bm = "basic_memory.cli.main:app"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "--cov=basic_memory --cov-report term-missing"
testpaths = ["tests", "test-int"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Any test hanging >120s fails with a stack dump instead of stalling on a
# deadlock until the whole run is abandoned.
timeout = 120
timeout_method = "thread"
filterwarnings = [
    "ignore:The default datetime adapter is deprecated as of Python 3\\.12.*:DeprecationWarning:aiosqlite\\.core",
    "ignore:codecs\\.open\\(\\) is deprecated\\. Use open\\(\\) instead\\.:DeprecationWarning:frontmatter",
    "ignore:Parsing dates involving a day of month without a year specified is ambiguous.*:DeprecationWarning:dateparser\\.utils\\.strptime",
]
markers = [
    "benchmark: Performance benchmark tests (deselect with '-m \"not benchmark\"')",
    "slow: Slow-running tests (deselect with '-m \"not slow\"')",
    "windows: Windows-specific tests (deselect with '-m \"not windows\"')",
    "smoke: Fast end-to-end smoke tests for MCP flows",
    "semantic: Tests requiring semantic dependencies (fastembed, sqlite-vec, openai)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "gevent>=24.11.1",
    "icecream>=2.1.3",
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=1.2.0",
    # Do NOT drop this because nothing imports it: pytest plugins load by entry
    # point, so an import-grep reports zero either way. With
    # asyncio_mode = "strict", pytest-asyncio only collects tests carrying an
    # explicit @pytest.mark.asyncio; pytest-aio is what collects the 55 bare
    # `async def test_` functions under tests/index/. Removing it fails them all
    # with "async def functions are not natively supported."
    "pytest-aio>=1.9.0",
    "pytest-xdist>=3.0.0",
    # test-int/semantic/conftest.py loads .env so provider API keys reach the
    # semantic benchmarks. Test-only - nothing under src/ reads dotenv.
    "python-dotenv>=1.1.0",
    "ruff>=0.1.6",
    "freezegun>=1.5.5",
    "pyright>=1.1.408",
    "pytest-testmon>=2.2.0",
    "ty>=0.0.18",
    "cst-lsp>=0.1.3",
    "libcst>=1.8.6",
    "pytest-timeout>=2.4.0",
    "pytest-split>=0.11.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.pyright]
include = ["src/"]
exclude = ["**/__pycache__"]
ignore = ["test/"]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnusedImport = "none"
pythonVersion = "3.12"

[tool.ty.terminal]
# Keep advisory diagnostics visible without treating them as type errors.
error-on-warning = false



[tool.coverage.run]
concurrency = ["thread", "gevent"]
parallel = true
source = ["basic_memory"]

[tool.coverage.report]
# Ratchet, not an aspiration (GAPS T20). 93.8 is the measured floor (93.83% on 2026-08-10, the
# first run with `*/cli/**` counted), not a target: raise it as tested code lands, never lower it
# to make a run pass. Set to the measured value rather than 100 so a coverage run cannot start red
# — "never ship on top of a red suite" applies here too.
fail_under = 93.8
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Exclude specific modules that are difficult to test comprehensively
omit = [
    "*/watch_service.py",           # File system watching - complex integration testing
    "*/services/initialization.py", # Startup orchestration + background tasks (watchers); exercised indirectly in entrypoints
    # `*/cli/**` was omitted here until 2026-08-07, on the premise that "the CLI is an interactive
    # wrapper; core logic is covered via API/MCP/service tests". This fork reverses that premise:
    # every verb in AGENTS.md's flat list lands in cli/, cli/direct.py is the supported route to the
    # service layer, and W5's notice machinery is CLI-side. Omitting it would make the verbs
    # invisible to coverage on the day they ship. See GAPS T20.
]
